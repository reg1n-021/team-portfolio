<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа - Пекарня</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">COMPANY 24</a>
    </div>
</nav>

<section class="section">
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="section-title">
                    <h2>Оформление заказа</h2>
                </div>
                <form method="POST" action="{{ url_for('order') }}">
                    {{ form.csrf_token }}
                    <input type="text" name="name" class="form-control" placeholder="Ваше имя" required>
                    <input type="tel" name="phone" class="form-control" placeholder="Ваш телефон" required>
                    <input type="text" name="product" class="form-control" value="{{ product_name }}" placeholder="Товар">
                    <textarea name="comment" class="form-control" rows="4" placeholder="Комментарий"></textarea>
                    <button type="submit" class="btn-order" style="width: 100%;">Отправить заказ</button>
                </form>
            </div>
        </div>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
