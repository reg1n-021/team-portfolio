<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог - Пекарня</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">COMPANY 24</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Главная</a></li>
                <!-- КНОПКА КАТАЛОГ УБРАНА -->
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#reviews">Отзывы</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#contacts">Контакты</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="section">
    <div class="container">
        <div class="section-title">
            <h1>Наш ассортимент</h1>
            <p>Вся выпечка, которую вы можете заказать</p>
        </div>
        <div class="row">
            {% for product in products %}
            <div class="col-md-4">
                <div class="product-card">
                    <h3>{{ product.name }}</h3>
                    <p>{{ product.price }} ₽ / {{ product.weight }}</p>
                    <a href="{{ url_for('product', product_id=product.id) }}" class="btn-order-small">Подробнее</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
