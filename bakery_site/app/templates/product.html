<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} - MR-Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-size: 28px; font-weight: bold; color: #f7b70b !important; }
        .btn-order { background: #f7b70b; color: white; padding: 12px 35px; text-decoration: none; display: inline-block; border-radius: 0; }
        .footer { background: #1a1a1a; color: #999; padding: 30px 0; text-align: center; margin-top: 50px; }
        .section { padding: 70px 0; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/">MR-Bakery</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="/catalog">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" href="/reviews">Отзывы</a></li>
            </ul>
        </div>
    </div>
</nav>
<section class="section">
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3 text-center">
                <h1>{{ product.name }}</h1>
                <p class="h2 text-warning">{{ product.price }} ₽</p>
                <p>{{ product.weight }}</p>
                <a href="/order" class="btn-order">Заказать</a>
                <br><br>
                <a href="/catalog">← Назад в каталог</a>
            </div>
        </div>
    </div>
</section>
<footer class="footer">
    <div class="container">
        <p>© 2026 MR-Bakery</p>
    </div>
</footer>
</body>
</html>
