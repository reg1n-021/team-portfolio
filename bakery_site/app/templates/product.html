<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - Пекарня</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">COMPANY 24</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('catalog') }}">Каталог</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#contacts">Контакты</a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="section">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <img src="{{ url_for('static', filename='images/' + product.image) }}" class="img-fluid" alt="{{ product.name }}">
            </div>
            <div class="col-md-6">
                <h1>{{ product.name }}</h1>
                <p><strong>Цена:</strong> {{ product.price }} ₽</p>
                <p><strong>Вес:</strong> {{ product.weight }}</p>
                <p><strong>Категория:</strong> {{ product.category }}</p>
                <p>{{ product.description }}</p>
                <p>
                    {% if product.in_stock %}
                    <span style="color: green;">✅ В наличии</span>
                    {% else %}
                    <span style="color: red;">❌ Нет в наличии</span>
                    {% endif %}
                </p>
                <a href="{{ url_for('order', product_id=product.id) }}" class="btn-order">Заказать</a>
            </div>
        </div>
    </div>
</section>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
