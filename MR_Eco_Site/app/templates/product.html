<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | MR Eco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo"><i class="fas fa-microchip"></i><span>MR Eco</span></div>
            <nav class="nav">
                <a href="{{ url_for('index') }}">Главная</a>
                <a href="{{ url_for('catalog') }}">Каталог</a>
                <a href="javascript:void(0)" id="cartIconProduct"><i class="fas fa-shopping-cart"></i> Корзина <span id="cartCount">0</span></a>
                <a href="{{ url_for('profile') }}">Профиль</a>
                <a href="javascript:void(0)" id="logoutBtnProduct">Выйти</a>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <main class="container">
        <div class="product-detail">
            <div class="product-image-large">
                <img src="{{ url_for('static', filename='images/' + product.image_url) }}" alt="{{ product.name }}" style="width: 100%; max-width: 300px; border-radius: 20px;">
            </div>
            <div class="product-detail-info">
                <h1>{{ product.name }}</h1>
                <div class="product-price-large">{{ product.price }} ₽</div>
                <div class="product-description">
                    <h3>Описание:</h3>
                    <p>{{ product.description }}</p>
                </div>
                <button class="btn-primary add-to-cart" 
                        data-id="{{ product.id }}" 
                        data-name="{{ product.name }}" 
                        data-price="{{ product.price }}" 
                        style="width: 100%; margin-top: 20px;">
                    Добавить в корзину
                </button>
                <a href="{{ url_for('catalog') }}" class="btn-secondary" style="display: block; text-align: center; margin-top: 15px;">
                    ← Назад в каталог
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo"><i class="fas fa-microchip"></i> MR Eco</div>
                <div class="footer-contacts">
                    <div class="contact-item"><i class="fas fa-envelope"></i><a href="mailto:catran12@yandex.ru">catran12@yandex.ru</a></div>
                    <div class="contact-item"><i class="fab fa-telegram"></i><a href="https://t.me/magomed_frontend" target="_blank">@magomed_frontend</a></div>
                    <div class="contact-item"><i class="fab fa-github"></i><a href="https://github.com/magomed" target="_blank">github.com/magomed</a></div>
                </div>
                <div class="footer-credits">
                    <p>Сделано с ❤️ <strong>Магомедом</strong> и <strong>Рамазаном</strong></p>
                    <p class="copyright">© 2026 MR Eco</p>
                </div>
            </div>
        </div>
    </footer>

    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <div class="cart-modal-header"><h3>Корзина</h3><span class="cart-close" id="cartClose">&times;</span></div>
            <div class="cart-modal-body" id="cartModalBody"><p>Корзина пуста</p></div>
            <div class="cart-modal-footer"><button class="btn-primary" id="checkoutBtnModal">Оформить заказ</button></div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function updateCartCount() {
            let count = cart.reduce((s, i) => s + i.quantity, 0);
            let el = document.getElementById('cartCount');
            if (el) el.innerText = count;
        }

        function addToCart(id, name, price) {
            let existing = cart.find(i => i.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ id: id, name: name, price: price, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert('✅ Добавлено: ' + name);
        }

        function openCartModal() {
            let modal = document.getElementById('cartModal');
            let body = document.getElementById('cartModalBody');
            if (cart.length === 0) {
                body.innerHTML = '<p style="text-align:center;">🛒 Корзина пуста</p>';
            } else {
                let html = '', total = 0;
                cart.forEach(item => {
                    let itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    html += `<div class="cart-item">
                        <span style="flex:2;"><strong>${item.name}</strong></span>
                        <span style="flex:1;">${item.price} ₽</span>
                        <span style="flex:1;">× ${item.quantity}</span>
                        <span style="flex:1; color:#2e7d32; font-weight:bold;">${itemTotal} ₽</span>
                        <button onclick="removeFromCart(${item.id})" style="background:#ff4444; color:white; border:none; border-radius:50%; width:25px; height:25px; cursor:pointer;">✕</button>
                    </div>`;
                });
                html += `<div class="cart-total">💰 Итого: ${total} ₽</div>`;
                body.innerHTML = html;
            }
            modal.style.display = 'flex';
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            openCartModal();
        }

        // Назначаем обработчики после загрузки страницы
        document.addEventListener('DOMContentLoaded', function() {
            let cartIcon = document.getElementById('cartIconProduct') || document.getElementById('cartIconCatalog');
            if (cartIcon) cartIcon.onclick = openCartModal;
            
            let cartClose = document.getElementById('cartClose');
            if (cartClose) cartClose.onclick = () => document.getElementById('cartModal').style.display = 'none';
            
            let checkoutBtn = document.getElementById('checkoutBtnModal');
            if (checkoutBtn) {
                checkoutBtn.onclick = () => {
                    if (cart.length === 0) alert('🛒 Корзина пуста');
                    else { 
                        alert('✅ Заказ оформлен! Спасибо за покупку!'); 
                        cart = []; 
                        localStorage.setItem('cart', JSON.stringify(cart)); 
                        updateCartCount(); 
                        document.getElementById('cartModal').style.display = 'none'; 
                    }
                };
            }
            
            window.onclick = (e) => { 
                if (e.target === document.getElementById('cartModal')) 
                    document.getElementById('cartModal').style.display = 'none'; 
            };
            
            // Добавляем обработчики для всех кнопок "В корзину"
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.onclick = () => addToCart(
                    parseInt(btn.dataset.id),
                    btn.dataset.name,
                    parseInt(btn.dataset.price)
                );
            });
            
            updateCartCount();
        });
    </script>
</body>
</html>
