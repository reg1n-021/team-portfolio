<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа | MR Eco</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo"><i class="fas fa-seedling"></i><span>MR Eco</span></div>
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="cart.html">Корзина</a>
                <a href="profile.html" id="profileLink">Профиль</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">📝 Оформление заказа</h1>
        
        <div class="checkout-grid">
            <div class="checkout-items">
                <h3>Ваши товары:</h3>
                <div id="checkoutItems"></div>
                <div class="checkout-total">
                    <h3>Итого: <span id="checkoutTotal">0</span> ₸</h3>
                </div>
            </div>
            
            <div class="checkout-form">
                <h3>Данные для доставки:</h3>
                <form id="orderForm">
                    <input type="text" id="orderName" placeholder="Ваше имя" required>
                    <input type="tel" id="orderPhone" placeholder="Номер телефона" required>
                    <input type="text" id="orderAddress" placeholder="Адрес доставки" required>
                    <textarea id="orderComment" placeholder="Комментарий к заказу"></textarea>
                    <button type="submit" class="btn-primary">Подтвердить заказ</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
