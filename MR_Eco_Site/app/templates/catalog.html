    <header class="header">
        <div class="container header-container">
            <div class="logo"><i class="fas fa-microchip"></i><span>MR Eco</span></div>
            <nav class="nav">
                <a href="{{ url_for('index') }}">Главная</a>
                <a href="{{ url_for('catalog') }}" class="active">Каталог</a>
                <a href="javascript:void(0)" id="cartIconCatalog"><i class="fas fa-shopping-cart"></i> Корзина <span id="cartCount">0</span></a>
                <a href="{{ url_for('profile') }}">Профиль</a>
                <a href="javascript:void(0)" id="logoutBtnCatalog">Выйти</a>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">📦 Каталог товаров</h1>
        
        <div class="filters-panel">
            <input type="text" id="searchInput" placeholder="🔍 Поиск товаров..." class="search-input">
            <select id="categoryFilter" class="filter-select">
                <option value="all">📋 Все категории</option>
                <option value="phones">📱 Смартфоны</option>
                <option value="laptops">💻 Ноутбуки</option>
                <option value="tvs">📺 Телевизоры</option>
                <option value="kitchen">🍳 Кухонная техника</option>
                <option value="appliances">🔌 Бытовая техника</option>
                <option value="eco">🌱 Эко-товары</option>
            </select>
            <div class="price-filters">
                <input type="number" id="minPrice" placeholder="От $" class="price-input">
                <input type="number" id="maxPrice" placeholder="До $" class="price-input">
            </div>
            <button id="resetFiltersBtn" class="btn-secondary">🔄 Сбросить</button>
        </div>

        <div class="products-grid" id="productsGrid"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo"><i class="fas fa-microchip"></i> MR Eco</div>
                <div class="footer-contacts">
                    <div class="contact-item"><i class="fas fa-envelope"></i><a href="mailto:catran12@yandex.ru">catran12@yandex.ru</a></div>
                    <div class="contact-item"><i class="fab fa-telegram"></i><a href="https://t.me/magomed_frontend" target="_blank">@magomed_frontend</a></div>
                    <div class="contact-item"><i class="fab fa-github"></i><a href="https://github.com/magomed" target="_blank">github.com/magomed</a></div>
                </div>
                <div class="footer-credits">
                    <p>Сделано с ❤️ <strong>Магомедом</strong> и <strong>Рамазаном</strong></p>
                    <p class="copyright">© 2026 MR Eco</p>
                </div>
            </div>
        </div>
    </footer>

    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <div class="cart-modal-header"><h3>Корзина</h3><span class="cart-close" id="cartClose">&times;</span></div>
            <div class="cart-modal-body" id="cartModalBody"><p>Корзина пуста</p></div>
            <div class="cart-modal-footer"><button class="btn-primary" id="checkoutBtnModal">Оформить заказ</button></div>
        </div>
    </div>
