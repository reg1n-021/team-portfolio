<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль | MR Eco</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo"><i class="fas fa-microchip"></i><span>MR Eco</span></div>
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="#" id="cartIconProfile"><i class="fas fa-shopping-cart"></i> Корзина <span id="cartCount">0</span></a>
                <a href="profile.html" class="active">Профиль</a>
                <a href="#" id="logoutBtnProfile">Выйти</a>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <main class="container">
        <div class="profile-header">
            <div class="profile-avatar"><i class="fas fa-user-astronaut"></i></div>
            <div class="profile-info">
                <h1 id="profileLogin"></h1>
                <p class="profile-phone" id="profilePhone"></p>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-item"><span class="stat-number" id="memberDays">1</span><span class="stat-name">День с нами</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number" id="totalOrders">0</span><span class="stat-name">Заказов</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number" id="totalSpent">$0</span><span class="stat-name">Потрачено</span></div>
        </div>

        <div class="orders-section">
            <h3><i class="fas fa-history"></i> История заказов</h3>
            <div id="userOrders" class="orders-list">
                <div class="empty-orders"><i class="fas fa-shopping-bag"></i><p>У вас пока нет заказов</p><a href="catalog.html" class="shop-link">Перейти в каталог →</a></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo"><i class="fas fa-microchip"></i> MR Eco</div>
                <div class="footer-contacts">
                    <div class="contact-item"><i class="fas fa-envelope"></i><a href="mailto:catran12@yandex.ru">catran12@yandex.ru</a></div>
                    <div class="contact-item"><i class="fab fa-telegram"></i><a href="https://t.me/magomed_frontend" target="_blank">@magomed_frontend</a></div>
                    <div class="contact-item"><i class="fab fa-github"></i><a href="https://github.com/magomed" target="_blank">github.com/magomed</a></div>
                </div>
                <div class="footer-credits">
                    <p>Сделано с ❤️ <strong>Магомедом</strong> и <strong>Рамазаном</strong></p>
                    <p class="copyright">© 2026 MR Eco</p>
                </div>
            </div>
        </div>
    </footer>

    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <div class="cart-modal-header"><h3>Корзина</h3><span class="cart-close" id="cartClose">&times;</span></div>
            <div class="cart-modal-body" id="cartModalBody"><p>Корзина пуста</p></div>
            <div class="cart-modal-footer"><button class="btn-primary" id="checkoutBtnModal">Оформить заказ</button></div>
        </div>
    </div>

    <style>
        .profile-header { background: linear-gradient(135deg, #2e7d32, #1b5e20); border-radius: 32px; padding: 40px; margin: 30px 0; display: flex; align-items: center; gap: 30px; flex-wrap: wrap; }
        .profile-avatar i { font-size: 80px; color: white; background: rgba(255,255,255,0.2); padding: 20px; border-radius: 50%; }
        .profile-info h1 { color: white; font-size: 1.8rem; }
        .profile-phone { color: rgba(255,255,255,0.8); }
        .stats-container { background: white; border-radius: 28px; padding: 30px 20px; display: flex; justify-content: space-around; align-items: center; margin-bottom: 40px; }
        .stat-item { text-align: center; flex: 1; }
        .stat-number { font-size: 2.2rem; font-weight: 800; display: block; }
        .stat-name { color: #6c7a8a; font-size: 0.85rem; }
        .stat-divider { width: 1px; height: 40px; background: #e0e4e8; }
        .orders-section { background: white; border-radius: 28px; padding: 30px; margin-bottom: 40px; }
        .orders-section h3 { margin-bottom: 20px; }
        .empty-orders { text-align: center; padding: 40px; color: #6c7a8a; }
        .empty-orders i { font-size: 3rem; color: #c8e6c9; margin-bottom: 15px; }
        .shop-link { color: #2e7d32; text-decoration: none; }
        .order-card { border: 1px solid #e0e4e8; border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .order-header { display: flex; justify-content: space-between; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; margin-bottom: 12px; }
        .order-number { font-weight: 700; color: #2e7d32; }
        .order-status { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-new { background: #e3f2fd; color: #1976d2; }
        .status-processing { background: #fff3e0; color: #f57c00; }
        .status-ready { background: #e8f5e9; color: #2e7d32; }
        .status-cancelled { background: #ffebee; color: #d32f2f; }
        .order-total { text-align: right; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; font-weight: 700; }
        .footer { background: #0f1a1f; color: #aaa; padding: 40px 0 24px; margin-top: 60px; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 30px; margin-bottom: 25px; padding-bottom: 25px; border-bottom: 1px solid #2a3a3f; }
        .footer-logo { font-size: 1.4rem; font-weight: 700; color: #5a9e4b; }
        .footer-contacts { display: flex; flex-direction: column; gap: 10px; }
        .contact-item { display: flex; align-items: center; gap: 10px; }
        .contact-item i { width: 25px; color: #5a9e4b; }
        .contact-item a { color: #ddd; text-decoration: none; }
        .contact-item a:hover { color: #7bc46e; }
        .footer-credits { text-align: right; }
        .footer-credits strong { color: #7bc46e; }
        .copyright { font-size: 0.8rem; margin-top: 5px; color: #6c7a8a; }
        .cart-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center; }
        .cart-modal-content { background:white; border-radius:28px; width:90%; max-width:550px; max-height:80vh; overflow-y:auto; }
        .cart-modal-header { display:flex; justify-content:space-between; padding:18px 24px; border-bottom:2px solid #e8f5e9; }
        .cart-close { font-size:2rem; cursor:pointer; }
        .cart-modal-body { padding:20px; }
        .cart-item { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #eee; flex-wrap:wrap; }
        .cart-total { text-align:right; margin-top:15px; padding-top:10px; border-top:2px solid #2e7d32; font-weight:800; }
        .cart-modal-footer { padding:16px 24px; border-top:2px solid #e8f5e9; }
        @media (max-width: 768px) {
            .profile-header { flex-direction: column; text-align: center; }
            .stats-container { flex-direction: column; gap: 15px; }
            .stat-divider { width: 80%; height: 1px; }
            .footer-content { flex-direction: column; text-align: center; }
            .footer-contacts { align-items: center; }
            .footer-credits { text-align: center; }
        }
    </style>

    <script src="script.js"></script>
</body>
</html>
