<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль | MR Eco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo"><i class="fas fa-microchip"></i><span>MR Eco</span></div>
            <nav class="nav">
                <a href="{{ url_for('main.index') }}">Главная</a>
                <a href="{{ url_for('main.catalog') }}">Каталог</a>
                <a href="#" id="cartIconProfile"><i class="fas fa-shopping-cart"></i> Корзина <span id="cartCount">0</span></a>
                <a href="{{ url_for('main.profile') }}" class="active">Профиль</a>
                <a href="#" id="logoutBtnProfile">Выйти</a>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="fas fa-bars"></i></button>
        </div>
    </header>

    <main class="container">
        <div class="profile-header">
            <div class="profile-avatar"><i class="fas fa-user-astronaut"></i></div>
            <div class="profile-info">
                <h1 id="profileLogin"></h1>
                <p class="profile-phone" id="profilePhone"></p>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-item"><span class="stat-number" id="memberDays">1</span><span class="stat-name">День с нами</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number" id="totalOrders">0</span><span class="stat-name">Заказов</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number" id="totalSpent">$0</span><span class="stat-name">Потрачено</span></div>
        </div>

        <div class="orders-section">
            <h3><i class="fas fa-history"></i> История заказов</h3>
            <div id="userOrders" class="orders-list">
                <div class="empty-orders"><i class="fas fa-shopping-bag"></i><p>У вас пока нет заказов</p><a href="{{ url_for('main.catalog') }}" class="shop-link">Перейти в каталог →</a></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo"><i class="fas fa-microchip"></i> MR Eco</div>
                <div class="footer-contacts">
                    <div class="contact-item"><i class="fas fa-envelope"></i><a href="mailto:catran12@yandex.ru">catran12@yandex.ru</a></div>
                    <div class="contact-item"><i class="fab fa-telegram"></i><a href="https://t.me/magomed_frontend" target="_blank">@magomed_frontend</a></div>
                    <div class="contact-item"><i class="fab fa-github"></i><a href="https://github.com/magomed" target="_blank">github.com/magomed</a></div>
                </div>
                <div class="footer-credits">
                    <p>Сделано с ❤️ <strong>Магомедом</strong> и <strong>Рамазаном</strong></p>
                    <p class="copyright">© 2026 MR Eco</p>
                </div>
            </div>
        </div>
    </footer>

    <div class="cart-modal" id="cartModal">
        <div class="cart-modal-content">
            <div class="cart-modal-header"><h3>Корзина</h3><span class="cart-close" id="cartClose">&times;</span></div>
            <div class="cart-modal-body" id="cartModalBody"><p>Корзина пуста</p></div>
            <div class="cart-modal-footer"><button class="btn-primary" id="checkoutBtnModal">Оформить заказ</button></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
