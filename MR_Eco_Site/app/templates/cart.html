<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина | MR Eco</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo"><i class="fas fa-seedling"></i><span>MR Eco</span></div>
            <nav class="nav">
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="cart.html" class="active"><i class="fas fa-shopping-cart"></i> Корзина <span id="cartCount" class="cart-count">0</span></a>
                <a href="profile.html" id="profileLink">Профиль</a>
                <a href="#" id="logoutBtn" style="display:none;">Выйти</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">🛒 Моя корзина</h1>
        
        <div class="cart-container">
            <div class="cart-header">
                <div>Товар</div>
                <div>Цена</div>
                <div>Кол-во</div>
                <div>Сумма</div>
                <div></div>
            </div>
            <div id="cartItems"></div>
            
            <div class="cart-total-section">
                <h3>Итого: <span id="cartTotal">0</span> ₸</h3>
                <button class="btn-primary" id="checkoutBtn">Оформить заказ →</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>© 2026 MR Eco — техника с заботой о планете</p></div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
