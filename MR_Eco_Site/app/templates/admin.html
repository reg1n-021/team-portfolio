<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | MR Eco</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header admin-header">
        <div class="container header-container">
            <div class="logo">
                <i class="fas fa-seedling"></i>
                <span>MR Eco Admin</span>
            </div>
            <nav class="nav">
                <a href="index.html">На сайт</a>
                <a href="#" id="adminLogoutBtn">Выйти</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">🛠️ Админ-панель</h1>
        
        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="orders">📋 Заказы</button>
            <button class="tab-btn" data-tab="products">📦 Товары</button>
            <button class="tab-btn" data-tab="users">👥 Пользователи</button>
        </div>
        
        <!-- Вкладка ЗАКАЗЫ -->
        <div id="ordersTab" class="admin-tab active">
            <div class="admin-filters">
                <input type="text" id="orderSearch" placeholder="Поиск по клиенту..." class="search-input">
                <select id="orderStatusFilter" class="filter-select">
                    <option value="all">Все статусы</option>
                    <option value="new">🟡 Новые</option>
                    <option value="processing">🟠 В процессе</option>
                    <option value="ready">🟢 Готовы</option>
                    <option value="cancelled">🔴 Отменены</option>
                </select>
            </div>
            <div id="adminOrders" class="admin-orders-list"></div>
        </div>
        
        <!-- Вкладка ТОВАРЫ -->
        <div id="productsTab" class="admin-tab">
            <div class="admin-actions">
                <button class="btn-primary" id="addProductBtn">+ Добавить товар</button>
            </div>
            <div class="admin-filters">
                <input type="text" id="adminProductSearch" placeholder="Поиск товаров...">
            </div>
            <div id="adminProducts" class="admin-products-list"></div>
        </div>
        
        <!-- Вкладка ПОЛЬЗОВАТЕЛИ -->
        <div id="usersTab" class="admin-tab">
            <div id="adminUsers" class="admin-users-list"></div>
        </div>
    </main>

    <style>
        .admin-header {
            background: #1a1a2e;
        }
        .admin-header .logo {
            color: #f57c00;
        }
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin: 30px 0 20px;
            border-bottom: 2px solid #e0e4e8;
        }
        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #666;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #2e7d32;
            border-bottom: 3px solid #2e7d32;
        }
        .admin-tab {
            display: none;
        }
        .admin-tab.active {
            display: block;
        }
        .admin-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .admin-orders-list, .admin-products-list, .admin-users-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .admin-order-card, .admin-product-card, .admin-user-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .admin-order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
        }
        .order-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-new { background: #e3f2fd; color: #1976d2; }
        .status-processing { background: #fff3e0; color: #f57c00; }
        .status-ready { background: #e8f5e9; color: #2e7d32; }
        .status-cancelled { background: #ffebee; color: #d32f2f; }
        .admin-order-items {
            margin: 10px 0;
            padding-left: 20px;
        }
        .admin-order-items a {
            color: #2e7d32;
            text-decoration: none;
        }
        .admin-order-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .admin-order-actions select, .admin-order-actions button {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .admin-product-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-user-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .admin-badge {
            background: #2e7d32;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
        }
        @media (max-width: 768px) {
            .admin-order-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>

    <script src="script.js"></script>
</body>
</html>
