{% extends "base.html" %}

{% block title %}Регистрация | MR Eco{% endblock %}

{% block content %}
<div class="register-page">
    <div class="register-wrapper">
        <div class="register-card">
            <div class="logo-auth">
                <i class="fas fa-microchip"></i>
                <h1>MR Eco</h1>
            </div>
            <h2>📝 Создать аккаунт</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>Логин</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regLogin" placeholder="Придумайте логин" autocomplete="off" required>
                    </div>
                    <span class="error-message" id="regLoginError"></span>
                </div>
                
                <div class="form-group">
                    <label>Номер телефона</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="regPhone" placeholder="+7 (___) ___-__-__" required>
                    </div>
                    <span class="error-message" id="regPhoneError"></span>
                </div>
                
                <div class="form-group">
                    <label>Email (необязательно)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="your@email.com">
                    </div>
                    <span class="error-message" id="regEmailError"></span>
                </div>
                
                <div class="form-group">
                    <label>Пароль</label>
                    <div class="input-wrapper">
                        <i class="fas fa-key"></i>
                        <input type="password" id="regPassword" placeholder="Минимум 6 символов" required>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <span>Надёжность пароля:</span>
                        <div class="strength-bar"></div>
                    </div>
                    <span class="error-message" id="regPasswordError"></span>
                </div>
                
                <div class="form-group">
                    <label>Подтверждение пароля</label>
                    <div class="input-wrapper">
                        <i class="fas fa-check-circle"></i>
                        <input type="password" id="regConfirmPassword" placeholder="Повторите пароль" required>
                    </div>
                    <span class="error-message" id="regConfirmError"></span>
                </div>
                
                <button type="submit" class="btn-register">Зарегистрироваться →</button>
            </form>
            
            <div class="login-link">
                Уже есть аккаунт? <a href="{{ url_for('main.login') }}">Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
