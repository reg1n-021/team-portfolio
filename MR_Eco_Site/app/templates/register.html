<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | MR Eco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-center"><i class="fas fa-microchip"></i><h1>MR Eco</h1></div>
            <h2>📝 Регистрация</h2>
            <form id="registerForm">
                <input type="text" id="regLogin" placeholder="Логин" required>
                <input type="password" id="regPassword" placeholder="Пароль" required>
                <input type="tel" id="regPhone" placeholder="Номер телефона" required>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
            <div class="auth-links"><p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
