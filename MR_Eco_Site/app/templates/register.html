<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | MR Eco</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-center"><i class="fas fa-microchip"></i><h1>MR Eco</h1></div>
            <h2>📝 Регистрация</h2>
            <form id="registerForm">
                <input type="text" id="regLogin" placeholder="Логин" required>
                <input type="password" id="regPassword" placeholder="Пароль" required>
                <input type="tel" id="regPhone" placeholder="Номер телефона" required>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
            <div class="auth-links"><p>Уже есть аккаунт? <a href="login.html">Войти</a></p></div>
        </div>
    </div>
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #e8f5e9, #ffffff); }
        .auth-card { background: white; padding: 40px; border-radius: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .logo-center { text-align: center; margin-bottom: 30px; }
        .logo-center i { font-size: 3rem; color: #2e7d32; }
        .auth-card input { width: 100%; padding: 12px 16px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; }
        .auth-links { text-align: center; margin-top: 20px; }
        .auth-links a { color: #2e7d32; text-decoration: none; }
    </style>
    <script src="script.js"></script>
</body>
</html>
